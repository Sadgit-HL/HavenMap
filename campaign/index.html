<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HavenTracker</title>
<link rel="stylesheet" href="../scripts/amd/amd.css">
<link rel="stylesheet" href="style.css?v=194">

<link rel="stylesheet" href="phone.css?v=8">
<link rel="stylesheet" href="monsters.css?v=13">

</head>
<body>
<header>
  <h1 id="title">Campaign</h1>
  <button id="pageBtn" type="button" class="pagebtn" aria-haspopup="dialog"></button>
  <nav id="tabs" role="tablist"></nav>
  <div class="actions">
    <span id="syncState" class="syncstate" role="status" hidden></span>
    <button id="undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
    <button id="settingsOpen" type="button" class="editbtn editicon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M19.14,12.94c0.04,-0.3,0.06,-0.61,0.06,-0.94c0,-0.32,-0.02,-0.64,-0.07,-0.94l2.03,-1.58c0.18,-0.14,0.23,-0.41,0.12,-0.61l-1.92,-3.32c-0.12,-0.22,-0.37,-0.29,-0.59,-0.22l-2.39,0.96c-0.5,-0.38,-1.03,-0.7,-1.62,-0.94L14.4,2.81c-0.04,-0.24,-0.24,-0.41,-0.48,-0.41h-3.84c-0.24,0,-0.43,0.17,-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22,-0.08,-0.47,0,-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14,-0.23,0.41,-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39,-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44,-0.17,0.47,-0.41l0.36,-2.54c0.59,-0.24,1.13,-0.56,1.62,-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59,-0.22l1.92,-3.32c0.12,-0.22,0.07,-0.47,-0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0,-3.6,-1.62,-3.6,-3.6s1.62,-3.6,3.6,-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></button>
  </div>
</header>
<main id="main"></main>
<div id="pageSheet" class="bsheetwrap" hidden></div>
<div class="modal" id="settingsModal" hidden>
  <div class="modalbox settingsbox" role="dialog" aria-labelledby="settingsTitle">
    <button type="button" class="modalx" id="settingsClose" aria-label="Close">&times;</button>
    <h3 id="settingsTitle">Settings</h3>
    <nav class="subtabs settabs" role="tablist" aria-label="Settings sections">
      <button type="button" role="tab" data-stab="display" aria-selected="false">Display</button>
      <button type="button" role="tab" data-stab="file" aria-selected="false">Campaign</button>
      <button type="button" role="tab" data-stab="profile" aria-selected="true">Profile</button>
      <button type="button" role="tab" data-stab="keys" aria-selected="false">Shortcuts</button>
    </nav>
    <section class="setsec" data-spanel="display" hidden>
      <div class="pm setpanel" id="displaySettings"></div>
    </section>
    <section class="setsec" data-spanel="file" hidden>
      <div class="setcols one"><section class="setcard"><h4>Shared campaign</h4><div id="shareBox"></div></section><section class="setcard"><h4>Campaign file</h4>
        <div class="setline"><span class="setlab">File</span><span class="setctl">
          <label class="btn">Load file <input id="file" type="file" accept="application/json,.json" hidden></label>
          <button id="export" type="button" class="btn">Export</button>
          <button id="clear" type="button" class="btn">Clear</button>
        </span></div>
      </section><section class="setcard"><h4>Invite links</h4><div id="adminBox"></div></section></div>
    </section>
    <section class="setsec" data-spanel="profile">
      <div class="setcols one"><section class="setcard"><h4>Profile</h4>
        <label class="setline"><span class="setlab">Your name</span><span class="setctl"><input id="userName" type="text" class="txt" maxlength="40" placeholder="Shown in the History tab"></span></label>
      </section></div>
    </section>
    <section class="setsec" data-spanel="keys" hidden>
      <div class="keylist setcols" id="keyList"></div>
    </section>
  </div>
</div>
<script type="module" src="app.js?v=246"></script>
</body>
</html>
