<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMD odds mockups</title>
<style>
:root{--bg:#16130f;--panel:#231d17;--line:#3a3026;--text:#ecdfc8;--muted:#a89a82;--accent:#c7a44a;--ok:#6cae75;--bad:#c9604f}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#0e0c09;color:var(--text);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
h1{font-size:17px;margin:0 0 4px;color:var(--accent)}
.intro{color:var(--muted);margin:0 0 18px}
.v{margin:0 0 26px}
.v h2{font-size:14px;margin:0 0 2px}.v h2 span{color:var(--accent);margin-right:6px}
.v p{color:var(--muted);margin:0 0 8px;max-width:980px}
/* the AMD view frame */
.amv{position:relative;width:1000px;height:330px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px}
.deck{display:flex;flex-direction:column;min-height:0;position:relative}
.amhd{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 18px;min-height:18px}
.amhd h5{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}.amhd h5 b{color:var(--text);font-size:13px}
.stacks{flex:1;display:flex;flex-wrap:wrap;gap:16px 16px;align-content:flex-start;padding:16px 8px 6px}
.stk{position:relative;width:78px;height:51px}
.stk .c{position:absolute;inset:0;border-radius:5px;border:1px solid #6b5a3c;background:linear-gradient(160deg,#3b2f22,#241c14);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#e9d9b6;z-index:2}
.stk .e{position:absolute;inset:0;border-radius:5px;background:#2b2219;border:1px solid #6b5a3c}
.stk .nb{position:absolute;right:-8px;top:-11px;z-index:3;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:#120f0b;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #000}
.c.bl{color:#f3e3a0}.c.cu{color:#d48a8a}
.amrow{display:flex;gap:8px}
.strip{flex:1;border:2px dashed rgba(236,223,200,.28);border-radius:10px;background:rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;padding:4px 8px;min-height:52px}
.strip .lab{width:54px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:8px;min-height:0}
.ctl{flex:0 0 86px;display:grid;grid-template-columns:1fr 44px;gap:8px}
.roll{border-radius:12px;border:2px solid #f0d68a;background:linear-gradient(180deg,#d9bb62,#a98826);color:#1b150c;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 #6a5316,0 6px 14px rgba(0,0,0,.45)}
.roll .ic{width:26px;height:26px;border:2px solid #1b150c;border-radius:6px}
.tools{display:grid;grid-template-rows:1fr 1fr;gap:8px}.tools span{border-radius:10px;border:1px solid var(--line);background:#2d2519}
.disc{flex:1;min-height:60px;border:2px dashed var(--accent);border-radius:12px;background:rgba(199,164,74,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.disc h5{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.disc h5 b{color:var(--text)}
.act{flex:0 0 70px;border:2px dashed rgba(236,223,200,.28);border-radius:10px;background:rgba(0,0,0,.2);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-top:4px}
.neg{color:var(--bad)}.pos{color:var(--ok)}.mid{color:var(--text)}
.mute{color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}

/* 1 inline row (current) */
.s1{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px}
.s1 .o{display:inline-flex;gap:4px;align-items:baseline;padding-bottom:3px;background:linear-gradient(currentColor,currentColor) left bottom/var(--p) 2px no-repeat,linear-gradient(var(--line),var(--line)) left bottom/100% 2px no-repeat}
.s1 i{font-style:normal;color:var(--muted)}.s1 b{min-width:3ch}

/* 2 segmented bar under the header */
.s2{flex:1 1 100%;display:grid;gap:3px;margin-top:4px}
.s2 .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.s2 .bar span{height:100%}
.s2 .lbl{display:flex;justify-content:space-between;font-size:11px}
.s2 .lbl span{display:inline-flex;gap:4px}.s2 .lbl i{font-style:normal;color:var(--muted)}

/* 3 histogram panel in the side column */
.s3{flex:none;border:1px solid var(--line);border-radius:10px;background:rgba(18,15,11,.7);padding:6px 10px;display:grid;grid-template-columns:34px 1fr 34px;gap:2px 8px;align-items:center;font-size:11.5px}
.s3 i{font-style:normal;color:var(--muted);text-align:right}
.s3 .tr{height:7px;border-radius:4px;background:#2d2519;overflow:hidden}.s3 .tr span{display:block;height:100%;background:currentColor;border-radius:4px}
.s3 b{text-align:right}

/* 4 inside the roll button */
.roll.big{flex-direction:row;gap:10px;padding:0 10px;justify-content:flex-start}
.roll .gr{display:grid;grid-template-columns:repeat(4,auto);gap:0 8px;font-size:11px;font-weight:700;text-align:center;line-height:1.15}
.roll .gr i{font-style:normal;font-weight:600;opacity:.7;font-size:10px;display:block}
.roll .gr .neg{color:#7a1e12}.roll .gr .pos{color:#1d4d22}.roll .gr .mid{color:#1b150c}

/* 5 third strip next to Top / Bottom */
.strip.odds{flex:1.4;gap:0;justify-content:space-around;border-style:solid;border-color:var(--line)}
.strip.odds .t{display:flex;flex-direction:column;align-items:center;font-size:10.5px;line-height:1.1}.strip.odds .t i{font-style:normal;color:var(--muted)}.strip.odds .t b{font-size:15px}

/* 6 column chart in the deck corner */
.s6{position:absolute;right:4px;bottom:62px;display:flex;align-items:flex-end;gap:5px;height:104px;padding:6px 8px 4px;border:1px solid var(--line);border-radius:10px;background:rgba(18,15,11,.85)}
.s6 .col{width:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;gap:2px}
.s6 .col .b{width:18px;border-radius:3px 3px 0 0;background:currentColor;opacity:.85}
.s6 .col i{font-style:normal;color:var(--muted)}

/* 7 diverging bar around 0 */
.s7{flex:1 1 100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:4px;font-size:11px}
.s7 .half{display:flex;height:14px;gap:1px}.s7 .l{justify-content:flex-end}
.s7 .half span{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#120f0b;min-width:0;overflow:hidden}
.s7 .zero{border:1px solid var(--line);border-radius:4px;padding:0 8px;height:18px;display:flex;align-items:center;gap:4px}
.s7 .ticks{grid-column:1/-1;display:flex;justify-content:space-between;color:var(--muted)}
.s7 .ticks b{color:var(--text)}

/* 8 scoreboard tiles in the side column */
.s8{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.s8 .t{border:1px solid var(--line);border-radius:8px;background:#1c1711;padding:3px 0 2px;text-align:center;line-height:1.1}
.s8 .t i{display:block;font-style:normal;color:var(--muted);font-size:10px}.s8 .t b{font-size:14px}
.s8 .t.w{grid-column:span 2}
.s8 .t.hl{border-color:currentColor}

/* 9 discard pile hat */
.disc .s9{display:flex;gap:6px;font-size:11px}
.s9 span{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}.s9 i{font-style:normal;color:var(--muted);font-size:10px}
</style></head><body>
<h1>AMD odds: placement and style</h1>
<p class="intro">Sample deck: standard 20 plus 2 Bless and 1 Curse (23 cards). Cumulative odds: le-2 and le-1 include misses, ge+1 and ge+2 include crits.</p>
<div id="out"></div>
<script>
const O = { miss: .087, le2: .130, le1: .348, z: .261, ge1: .391, ge2: .174, crit: .130 };
const EX = [['Miss', .087, 'neg'], ['-2', .043, 'neg'], ['-1', .217, 'neg'], ['0', .261, 'mid'], ['+1', .217, 'pos'], ['+2', .043, 'pos'], ['Crit', .130, 'pos']];
const CELLS = [['miss', 'Miss', 'neg'], ['le2', '&le;-2', 'neg'], ['le1', '&le;-1', 'neg'], ['z', '0', 'mid'], ['ge1', '&ge;+1', 'pos'], ['ge2', '&ge;+2', 'pos'], ['crit', 'Crit', 'pos']];
const pc = p => Math.round(100 * p) + '%';
const DECK = [['+0', 6], ['+1', 5], ['-1', 5], ['+2', 1], ['-2', 1], ['x2', 1], ['Miss', 1], ['B', 2, 'bl'], ['C', 1, 'cu']];
const stack = ([f, n, cls]) => `<div class="stk">${n > 1 ? '<span class="e" style="left:3px;top:-3px"></span>' : ''}${n > 2 ? '<span class="e" style="left:6px;top:-6px"></span>' : ''}<span class="c ${cls || ''}">${f}</span>${n > 1 ? `<span class="nb">${n}</span>` : ''}</div>`;
const COL = { neg: 'var(--bad)', mid: '#8a7b63', pos: 'var(--ok)' };

// parts of the view; a variant fills the slots
function view(s = {}) {
  return `<div class="amv"><div class="deck"><div class="amhd"><h5>Deck &middot; <b>23</b></h5>${s.head || ''}</div>${s.corner || ''}<div class="stacks">${DECK.map(stack).join('')}</div>
  <div class="amrow"><div class="strip"><span class="lab">Top</span></div><div class="strip"><span class="lab">Bottom</span></div>${s.strip || ''}</div></div>
  <div class="side"><div class="ctl">${s.roll || '<div class="roll"><span class="ic"></span>Roll code</div>'}<div class="tools"><span></span><span></span></div></div>${s.side || ''}
  <div class="disc"><h5>Discard &middot; <b>0</b></h5>${s.disc || ''}</div><div class="act">Active &middot; <b>0</b></div></div></div>`;
}

const V = [
  ['Inline row (current)', 'One line in the deck header, each figure with a thin share bar underneath.',
    view({ head: `<div class="s1">${CELLS.map(([k, l, t]) => `<span class="o ${t}" style="--p:${100 * O[k]}%"><i>${l}</i><b class="tn">${pc(O[k])}</b></span>`).join('')}</div>` })],
  ['Segmented bar in the header', 'One bar of the seven exclusive results (shares sum to 100), cumulative figures written under it at the matching edge.',
    view({ head: `<div class="s2"><div class="bar">${EX.map(([, p, t]) => `<span style="width:${100 * p}%;background:${COL[t]};opacity:${t === 'mid' ? .7 : .55 + p}"></span>`).join('')}</div><div class="lbl">${CELLS.map(([k, l, t]) => `<span class="${t}"><i>${l}</i><b class="tn">${pc(O[k])}</b></span>`).join('')}</div></div>` })],
  ['Histogram panel in the side column', 'Seven horizontal bars between the roll button and the discard. Reads top to bottom from worst to best.',
    view({ side: `<div class="s3">${CELLS.map(([k, l, t]) => `<i>${l}</i><span class="tr ${t}"><span style="width:${100 * O[k]}%"></span></span><b class="tn ${t}">${pc(O[k])}</b>`).join('')}</div>` })],
  ['On the roll button', 'The odds live on the button you press to roll: four key figures (Miss, le-1, ge+1, Crit), the rest in the tooltip.',
    view({ roll: `<div class="roll big"><span class="ic"></span><span class="gr"><span class="neg"><i>Miss</i>${pc(O.miss)}</span><span class="neg"><i>&le;-1</i>${pc(O.le1)}</span><span class="pos"><i>&ge;+1</i>${pc(O.ge1)}</span><span class="pos"><i>Crit</i>${pc(O.crit)}</span></span></div>` })],
  ['Third strip beside Top and Bottom', 'A framed odds strip in the row of the Top and Bottom strips; large numbers, label above.',
    view({ strip: `<div class="strip odds">${CELLS.map(([k, l, t]) => `<span class="t"><i>${l}</i><b class="tn ${t}">${pc(O[k])}</b></span>`).join('')}</div>` })],
  ['Column chart in the deck corner', 'Small bar chart pinned at the bottom right of the deck area, above the Top and Bottom strips.',
    view({ corner: `<div class="s6">${CELLS.map(([k, l, t]) => `<span class="col ${t}"><b class="tn">${pc(O[k])}</b><span class="b" style="height:${Math.max(2, 120 * O[k])}px"></span><i>${l}</i></span>`).join('')}</div>` })],
  ['Diverging bar around 0', 'Negatives grow left in red, positives right in green, exact 0 in the middle. Totals at the ends.',
    view({ head: `<div class="s7"><div class="half l">${EX.slice(0, 3).map(([f, p, t]) => `<span style="width:${100 * p / .348 * .9}%;background:${COL[t]};opacity:${f === 'Miss' ? 1 : f === '-2' ? .8 : .6}" title="${f}">${p > .06 ? f : ''}</span>`).join('')}</div><span class="zero"><span class="mute">0</span><b class="tn">${pc(O.z)}</b></span><div class="half">${EX.slice(4).map(([f, p, t]) => `<span style="width:${100 * p / .391 * .9}%;background:${COL[t]};opacity:${f === 'Crit' ? 1 : f === '+2' ? .8 : .6}" title="${f}">${p > .06 ? f : ''}</span>`).join('')}</div><div class="ticks"><span><span class="neg">Miss <b>${pc(O.miss)}</b></span> &middot; &le;-2 <b>${pc(O.le2)}</b> &middot; &le;-1 <b>${pc(O.le1)}</b></span><span>&ge;+1 <b>${pc(O.ge1)}</b> &middot; &ge;+2 <b>${pc(O.ge2)}</b> &middot; <span class="pos">Crit <b>${pc(O.crit)}</b></span></span></div></div>` })],
  ['Scoreboard tiles in the side column', 'Tiles under the roll button: Miss and Crit wide and framed, the five thresholds as small tiles.',
    view({ side: `<div class="s8"><span class="t w hl neg"><i>Miss</i><b class="tn">${pc(O.miss)}</b></span><span class="t w hl pos"><i>Crit</i><b class="tn">${pc(O.crit)}</b></span>${CELLS.slice(1, 6).map(([k, l, t]) => `<span class="t ${t}"><i>${l}</i><b class="tn">${pc(O[k])}</b></span>`).join('')}<span class="t mute" style="opacity:.5"><i>cards</i><b class="tn">23</b></span></div>` })],
  ['In the empty discard', 'The odds sit inside the discard area while it is empty and move under its heading once cards are discarded.',
    view({ disc: `<div class="s9">${CELLS.map(([k, l, t]) => `<span><i>${l}</i><b class="tn ${t}">${pc(O[k])}</b></span>`).join('')}</div>` })],
];
document.getElementById('out').innerHTML = V.map(([t, d, h], i) => `<section class="v"><h2><span>${i + 1}</span>${t}</h2><p>${d}</p>${h}</section>`).join('');
</script>
</body></html>
