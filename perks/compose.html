<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layered vs scan</title>
<link rel="stylesheet" href="../scripts/amd/amd.css?v=4">
<link rel="stylesheet" href="style.css?v=12">
<link rel="stylesheet" href="compose.css?v=16">
</head>
<body>
<header>
  <h1>Layered composition vs baked scan</h1>
  <div class="controls">
    <select id="filter">
      <option value="all">All shared faces</option>
      <option value="frame">Frame available</option>
      <option value="noframe">No frame yet</option>
    </select>
    <input id="search" type="search" placeholder="Filter by slug, e.g. poison, heal, flip...">
    <label><input type="checkbox" id="diff"> Show difference (composed over scan)</label>
    <span id="count" class="muted"></span>
  </div>
  <div class="legend">
    <span><b>Composed =</b> frame + centre icon(s) + rolling side icon. Corner badges use the exported discs (+0 to +3, -1; -2 is built from -1 and the -2 number) with the class icon of the first class that uses the face. <code>+4</code> has no disc yet and shows a CSS placeholder.</span>
  </div>
</header>
<main id="main"></main>
<script type="module" src="compose.js?v=28"></script>
</body>
</html>
