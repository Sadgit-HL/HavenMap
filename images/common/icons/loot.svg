<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <!-- Chest body -->
  <rect x="2" y="12" width="18" height="8" rx="1.2" fill="#5c3317" stroke="#c9a227" stroke-width="1.4"/>
  <!-- Chest lid (arched top) -->
  <path d="M2,13 L2,7 Q2,3.5 11,3.5 Q20,3.5 20,7 L20,13 Z" fill="#7a4a25" stroke="#c9a227" stroke-width="1.4"/>
  <!-- Gold band at split -->
  <rect x="2" y="12" width="18" height="1.8" fill="#c9a227"/>
  <!-- Vertical gold straps -->
  <line x1="7.5" y1="13.8" x2="7.5" y2="20" stroke="#c9a227" stroke-width="0.9"/>
  <line x1="14.5" y1="13.8" x2="14.5" y2="20" stroke="#c9a227" stroke-width="0.9"/>
  <!-- Lock plate -->
  <rect x="8.8" y="11.2" width="4.4" height="3.6" rx="0.8" fill="#c9a227"/>
  <!-- Lock keyhole -->
  <circle cx="11" cy="12.6" r="1.1" fill="#5c3317"/>
</svg>
